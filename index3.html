<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie com CSS</title>
  <style>
/* styles.css */

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f9f5ea;
}

.cookie {
    width: 300px;
    height: 300px;
    background-color: #fae1dc; /* Cor de fundo do cookie */
    border-radius: 50%; /* Forma circular */
    position: relative;
    overflow: hidden; /* Esconde partes de elementos posicionados fora do container */
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); /* Sombra suave */
}

.chocolate {
    position: absolute;
    width: 150px;
    height: 150px;
    background-color: #5f3c2b; /* Cor do chocolate */
    border-radius: 50%; /* Forma circular */
    top: 50px;
    left: 50px;
    z-index: 1; /* Para ficar sobreposto ao cookie */
    transform: rotate(-30deg);
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3); /* Sombra interna */
}

.chocolate-piece {
    position: absolute;
    width: 50px;
    height: 50px;
    background-color: #f9f5ea; /* Cor do biscoito */
    border-radius: 50%; /* Forma circular */
    transform: rotate(-45deg);
    box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.1); /* Sombra suave */
}

.piece1 {
    top: 20px;
    left: 90px;
}

.piece2 {
    top: 50px;
    left: 170px;
}

.piece3 {
    top: 120px;
    left: 220px;
}

.piece4 {
    top: 190px;
    left: 130px;
}

.piece5 {
    top: 220px;
    left: 50px;
}

/* Gradiente para adicionar textura no chocolate */
.chocolate::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(circle at 70% 60%, rgba(255, 255, 255, 0.2), transparent);
}

/* Detalhes adicionais para o biscoito */
.chocolate-piece::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, transparent 50%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.5) 0%, transparent 50%);
}


</style>
</head>
<body>
    <div class="cookie">
        <div class="chocolate"></div>
        <div class="chocolate-piece piece1"></div>
        <div class="chocolate-piece piece2"></div>
        <div class="chocolate-piece piece3"></div>
        <div class="chocolate-piece piece4"></div>
        <div class="chocolate-piece piece5"></div>
    </div>
</body>
</html>
