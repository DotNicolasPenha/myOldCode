<!DOCTYPE html>
<header>
<style>
 *{
    font-family:Arial;

   }

display:none;

box-shadow:0px  2px 5px rgb(100,100,100);

 border-radius:10px;

button{
cursor:pointer;

border:none;
color:white;

}
h2{
color:green;
text-align:center;

}
input{
border:none;
padding:10px;
background:rgb(220,220,220);
margin-top:10px;
margin-bottom:10px;

}

background:DarkGreen;
}

margin-left:70px;
}
li{
color:green;
}
</style>
</header>


<html>
<body>
<button  class="btn-1" onclick="Cl1()">Criar lista</button>
<div id="CardList">
  <h2>Crie sua lista</h2>
  <input placeholder="Digite o nome da sua lista" onchange="Nl()" id="NameList">
 <input placeholder="Digite sua tarefa" onchange="add()" id="tarefa">
  <ul id="lista">

   </ul>
  <button onclick="Cl2()" id="Btn-2">Criar</button>
</div>
</body>
<script>
const Card = document.getElementById("CardList")
const tarefa =  document.getElementById("tarefa")
const NomeDaLista  =  document.getElementById("NameList")
const list =  document.getElementById("lista")

function add(){
const li = document.createElement("li")
li.textContent = tarefa.value
list.appendChild(li)
}

function Cl1(){
Card.style.display = "block"

}
function Cl2(){
Card.style.display = "none"
list.removeChild(li)

}



</script>
</html>
